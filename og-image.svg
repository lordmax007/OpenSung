<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070e"/>
      <stop offset="100%" stop-color="#0d0d1f"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="82%" cy="68%" r="38%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Grid -->
  <g stroke="rgba(124,58,237,0.06)" stroke-width="1">
    <line x1="0" y1="60"  x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="60"  y1="0" x2="60"  y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <!-- Glow halo behind title -->
  <ellipse cx="600" cy="295" rx="420" ry="170" fill="rgba(124,58,237,0.10)" filter="url(#soft)"/>

  <!-- Bot icon -->
  <text x="600" y="200" font-size="88" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">🤖</text>

  <!-- OpenSung title -->
  <text x="600" y="330"
        font-size="118" font-weight="900" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        letter-spacing="-5"
        fill="url(#tg)"
        filter="url(#glow)">OpenSung</text>

  <!-- Tagline -->
  <text x="600" y="390"
        font-size="26" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        fill="rgba(148,163,184,0.85)" letter-spacing="0.5">
    Arise. Desperte o poder do seu grupo.
  </text>

  <!-- Divider -->
  <rect x="500" y="415" width="200" height="3" rx="99" fill="url(#div)" opacity="0.9"/>

  <!-- Sub label -->
  <text x="600" y="460"
        font-size="18" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        fill="rgba(124,58,237,0.75)" letter-spacing="4">
    BOT PARA WHATSAPP
  </text>

  <!-- WhatsApp dots -->
  <circle cx="485" cy="455" r="5" fill="#25d366" opacity="0.9"/>
  <circle cx="715" cy="455" r="5" fill="#25d366" opacity="0.9"/>

  <!-- Outer border glow -->
  <rect x="1" y="1" width="1198" height="628" fill="none"
        stroke="rgba(124,58,237,0.28)" stroke-width="2"/>
</svg>
